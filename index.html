<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E3A94B'/%3E%3Cpath d='M9 23c0-8 5-13 14-14 0 9-5 14-14 14z' fill='none' stroke='%232B1F05' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Controle de Licitações</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: menu lateral escuro + área de trabalho clara; cada módulo é uma tela (painel, tabelas, quadro, calculadora). */
:root{
  --bg:#EFF3EE; --surface:#FFFFFF; --surface-2:#F5F8F4; --line:#DAE2D8; --line-strong:#C3CFC1;
  --fg:#15241D; --muted:#58695F; --faint:#86968C;
  --brand:#17302A; --brand-2:#21443B; --brand-fg:#E1ECE4; --brand-muted:#9DB4A5;
  --accent:#E3A94B; --accent-ink:#2B1F05;
  --primary:#2F6B48; --primary-hover:#265A3B; --primary-fg:#F4F8F4; --primary-soft:#DCEBDD;
  --ok:#25693F; --ok-bg:#DBEEE1; --warn:#835410; --warn-bg:#F7E8C6; --bad:#A3342A; --bad-bg:#F7DDD8;
  --info:#27607F; --info-bg:#DBEAF3; --viol:#5B4A8C; --viol-bg:#E8E3F4; --neutral:#4D5E54; --neutral-bg:#E5EAE4;
  --shadow:0 1px 2px rgba(20,36,29,.06),0 6px 20px rgba(20,36,29,.06);
  --font:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Domine',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1713; --surface:#15231D; --surface-2:#1A2B24; --line:#2A3D34; --line-strong:#3A5046;
    --fg:#E4EEE7; --muted:#9BB0A3; --faint:#74887C;
    --brand:#0A120F; --brand-2:#17271F; --brand-fg:#DDE9E1; --brand-muted:#8FA699;
    --accent:#E3A94B; --accent-ink:#2B1F05;
    --primary:#5DB380; --primary-hover:#74C493; --primary-fg:#0C1A13; --primary-soft:#1F3B2D;
    --ok:#7BD3A0; --ok-bg:#1D3A2B; --warn:#E8B964; --warn-bg:#3A2F14; --bad:#F0907F; --bad-bg:#43221D;
    --info:#86BCDD; --info-bg:#1B3444; --viol:#B7A7EA; --viol-bg:#2D2745; --neutral:#A9BBB0; --neutral-bg:#223229;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0E1713; --surface:#15231D; --surface-2:#1A2B24; --line:#2A3D34; --line-strong:#3A5046;
    --fg:#E4EEE7; --muted:#9BB0A3; --faint:#74887C;
    --brand:#0A120F; --brand-2:#17271F; --brand-fg:#DDE9E1; --brand-muted:#8FA699;
    --accent:#E3A94B; --accent-ink:#2B1F05;
    --primary:#5DB380; --primary-hover:#74C493; --primary-fg:#0C1A13; --primary-soft:#1F3B2D;
    --ok:#7BD3A0; --ok-bg:#1D3A2B; --warn:#E8B964; --warn-bg:#3A2F14; --bad:#F0907F; --bad-bg:#43221D;
    --info:#86BCDD; --info-bg:#1B3444; --viol:#B7A7EA; --viol-bg:#2D2745; --neutral:#A9BBB0; --neutral-bg:#223229;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tnum,td,th,.kpi-v{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--brand);color:var(--brand-fg);position:sticky;top:0;align-self:start;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 14px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{display:block;font-family:var(--display);font-size:15px;line-height:1.2;font-weight:700}
.brand span{font-size:12px;color:var(--brand-muted)}
.nav-g{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-muted);padding:14px 10px 4px;font-weight:600}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;border:0;background:transparent;color:var(--brand-fg);width:100%;text-align:left;cursor:pointer;font-weight:600;font-size:14px}
.nav:hover{background:var(--brand-2)}
.nav[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .n{margin-left:auto;font-size:12px;font-weight:700;opacity:.8;min-width:20px;text-align:center}
.nav .n.late{background:var(--bad);color:#fff;opacity:1;border-radius:99px;padding:0 6px}
.sair-m{display:none}
.login-ov{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.login{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.login .brand-mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.login h1{font:700 22px/1.2 var(--display)}
.login-sub{color:var(--muted)}
.login .fld{display:flex;flex-direction:column;gap:6px}
.login .fld-l{font-weight:600;font-size:13px}
.login input{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:10px 12px;width:100%}
.login-msg{color:var(--bad);min-height:20px;font-size:13px}
.login .btn{justify-content:center;padding:11px 14px}
.side-foot{margin-top:auto;padding-top:16px;font-size:12px;color:var(--brand-muted)}
.side-foot button{background:transparent;border:1px solid var(--brand-2);color:var(--brand-fg);border-radius:8px;padding:7px 10px;cursor:pointer;width:100%;font-size:12.5px;margin-top:8px}
.side-foot button:hover{background:var(--brand-2)}

.main{padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1480px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-family:var(--display);font-size:26px;line-height:1.2;font-weight:700}
.ph p{color:var(--muted);margin-top:2px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{color:var(--bad);border-color:var(--line-strong)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--neutral-bg);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--neutral-bg);color:var(--fg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card-p{padding:18px 20px}
.card h3{font-size:14.5px;font-weight:700}
.card .sub{color:var(--muted);font-size:12.5px}
.filters{padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.filters .fld{min-width:130px;flex:1 1 130px}
.filters .fld.grow{flex:2 1 240px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld-l{font-size:12.5px;font-weight:600;color:var(--fg)}
.fld-h{font-size:12px;color:var(--muted)}
.fld-h.ok{color:var(--ok)} .fld-h.warn{color:var(--warn)} .fld-h.bad{color:var(--bad)}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:8px 11px;min-height:38px;color:var(--fg)}
textarea{resize:vertical;min-height:70px}
input:disabled,select:disabled{background:var(--surface-2);color:var(--muted)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);flex:none}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:36px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tbody tr.row{cursor:pointer}
td.nw{white-space:nowrap}
tbody tr.row:hover td{background:var(--surface-2)}
tr.det td{background:var(--surface-2);padding:16px 18px 18px}
.caret{color:var(--faint);display:inline-grid;transition:transform .12s}
tr.open .caret{transform:rotate(90deg)}
.cell-t{font-weight:600}
.cell-s{color:var(--muted);font-size:12.5px}
.clip{max-width:340px}
.empty{padding:42px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:14px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)} .pill.viol{background:var(--viol-bg);color:var(--viol)} .pill.primary{background:var(--primary-soft);color:var(--primary)}
.pill.solid{background:var(--primary);color:var(--primary-fg)}
.ex{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);padding:1px 6px;border-radius:5px;font-weight:700;margin-left:6px;vertical-align:middle}

.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-l{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi-v{font-family:var(--display);font-size:28px;line-height:1.2;font-weight:700}
.kpi-s{color:var(--muted);font-size:12px}
.sec-t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 10px}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0}
.goal{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:7px;min-width:0}
.goal:last-child{border-right:0}
.goal-v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}
.goal-v small{font-family:var(--font);font-size:13px;color:var(--muted);font-weight:500}
.bar{height:7px;border-radius:99px;background:var(--neutral-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--accent)} .bar.bad i{background:var(--bad)}
.blist{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.brow{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.brow .bar{height:10px;border-radius:5px}.brow .bar i{border-radius:5px}
.brow b{font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:16px}
.colb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.colb .pair{display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center;flex:1}
.colb .pair i{display:block;width:42%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px}
.colb .a{background:var(--primary-soft);border:1px solid var(--primary)} .colb .b{background:var(--primary)}
.colb span{font-size:12px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.lrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .d{width:46px;flex:none;text-align:center;line-height:1.15;font-weight:700}
.lrow .d small{display:block;color:var(--muted);font-weight:500;font-size:11px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip b{color:var(--fg);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.chip[aria-pressed="true"] b{color:var(--primary-fg)}

.overlay{position:fixed;inset:0;background:rgba(8,16,12,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:60;overflow:auto}
.overlay.top{z-index:80;align-items:center}
.modal{background:var(--surface);border-radius:16px;width:min(780px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;margin:auto}
.modal.sm{width:min(440px,100%)}
.modal.lg{width:min(980px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:12px}
.modal-head h2{font-family:var(--display);font-size:19px;font-weight:700}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 16px 16px}
.modal-foot .sp{margin-right:auto}
.fs{display:flex;flex-direction:column;gap:12px}
.fs-t{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:6px;border-top:1px solid var(--line)}
.fs:first-child .fs-t{border-top:0;padding-top:0}
.row2,.row3,.row4{display:grid;gap:12px}
.row2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row4{grid-template-columns:repeat(4,minmax(0,1fr))}
.err{background:var(--bad-bg);color:var(--bad);padding:9px 12px;border-radius:9px;font-weight:600;font-size:13px}
.note{background:var(--info-bg);color:var(--info);padding:9px 12px;border-radius:9px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--brand-fg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:100;font-weight:600;max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}

.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 22px}
.dgrid dt{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dgrid dd{margin:2px 0 0;overflow-wrap:anywhere}
.dgrid dd.wide{grid-column:1/-1}
.dact{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.weekbar .t{font-family:var(--display);font-weight:700;font-size:16px;min-width:210px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg)}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:14px}
.kcol{flex:1 0 236px;max-width:340px;background:var(--neutral-bg);border-radius:13px;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:120px}
.kcol.over{outline:2px dashed var(--primary);outline-offset:-2px}
.kcol.late{background:var(--bad-bg)}
.kh{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px;gap:8px}
.kh b{font-size:13.5px}.kh span{font-size:12px;color:var(--muted)}
.kh .today{background:var(--accent);color:var(--accent-ink);padding:0 7px;border-radius:99px;font-size:11px;font-weight:700;margin-left:6px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:0 1px 2px rgba(20,36,29,.07)}
.kcard:hover{border-color:var(--line-strong)}
.kcard.done .kt{text-decoration:line-through;color:var(--muted)}
.kcard.dragging{opacity:.45}
.kt-row{display:flex;gap:9px;align-items:flex-start}
.kt{font-weight:600;line-height:1.35;flex:1;min-width:0;overflow-wrap:anywhere}
.tick{width:19px;height:19px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;color:var(--primary-fg);margin-top:1px;padding:0}
.tick:hover{border-color:var(--primary)}
.tick.on{background:var(--primary);border-color:var(--primary)}
.kmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.kadd{border:0;background:transparent;color:var(--muted);text-align:left;padding:7px 6px;border-radius:8px;cursor:pointer;font-weight:600;display:flex;gap:6px;align-items:center}
.kadd:hover{background:var(--surface);color:var(--fg)}
.cl-item{display:flex;gap:9px;align-items:center}
.cl-item input[type=text]{flex:1}

.orc{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:18px;align-items:start}
.orc-res{position:sticky;top:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.res-big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.15}
.scale{position:relative;height:16px;border-radius:8px;overflow:hidden;background:var(--neutral-bg);margin-top:6px}
.scale i{position:absolute;top:0;bottom:0}
.scale u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--fg);text-decoration:none;border-radius:2px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}

async function criarChecklistEdital(e) {
  if (!e.dataSessao) { toast('Informe a data da sessão no edital antes de criar o checklist.', 'bad'); return; }
  const today = todayISO();
  const existentes = new Set(S.data.tarefas.filter(t => t.editalId === e.id && t.modelo).map(t => t.modelo));
  const novos = MODELO_EDITAL.map((m, i) => ({ m, i })).filter(x => !existentes.has('ed-' + e.id + '-' + x.i));
  if (!novos.length) { toast('Este edital já tem o checklist na agenda.'); return; }
  const first = null;
  await Promise.all(novos.map(x => {
    const base = x.m.base === 'cap' ? (e.dataCaptacao || today) : e.dataSessao;
    let d = addDays(base, x.m.off);
    if (d < today && e.dataSessao >= today && x.m.base === 'ses') d = today;
    return dbSave('tarefas', null, { titulo: x.m.t, descr: '', editalId: e.id, data: d, status: 'todo', etiqueta: x.m.etq, responsavel: x.m.resp, checklist: [], modelo: 'ed-' + e.id + '-' + x.i, criadoEm: Date.now() });

}

  const enc = base * (p.encargos + p.inss);
  const total = base + enc + (+f.alimTransp || 0) + (+f.epi || 0);
  return { base: base, enc: enc, total: total, hora: total / (p.dias * p.horas) };
}

  const mensal = dep + (+e.manutencao || 0) + (+e.combustivel || 0) + (+e.seguro || 0);
  return { dep: dep, mensal: mensal, hora: e.horasUso > 0 ? mensal / e.horasUso : null };

const newOrc = () => ({ id: null, nome: '', editalId: '', empresa: '', objeto: '', valorEstimado: null, meses: 12, equipes: 1, itens: {}, custoManual: null, extras: 0, indireto: 5 });
function calcOrc(o) {
  const p = S.prem;
  let mensal = 0;
  Object.keys(o.itens).forEach(k => {
    const ded = (+o.itens[k] || 0) / 100; if (!ded) return;
    const rec = byId(k[0] === 'f' ? 'funcionarios' : 'equipamentos', k.slice(2)); if (!rec) return;
    mensal += (k[0] === 'f' ? funcCusto(rec).total : equipCusto(rec).mensal) * ded;
  });
  const temItens = Object.values(o.itens).some(v => +v > 0);
  if (!temItens && o.custoManual > 0) mensal = +o.custoManual;
  const direto = (+o.meses || 0) * (+o.equipes || 0) * mensal + (+o.extras || 0);
  const indir = direto * ((+o.indireto || 0) / 100);
  const custo = direto + indir;
  const dv = m => 1 - p.aliquota - m;
  const alvo = dv(p.margem) > 0 ? custo / dv(p.margem) : null, minimo = dv(p.piso) > 0 ? custo / dv(p.piso) : null, equil = custo / (1 - p.aliquota);
  const est = o.valorEstimado > 0 ? +o.valorEstimado : null;
  const margemEst = est && custo ? 1 - p.aliquota - custo / est : null;
  let v;
  if (!custo) v = { k: 'warn', t: 'Escolha a equipe ou informe o custo mensal para calcular.' };
  else if (!est) v = { k: 'warn', t: 'Informe o valor estimado do edital para comparar.' };
  else if (alvo <= est) v = { k: 'ok', t: 'Cabe com a margem alvo. Lance entre ' + brl(minimo) + ' e ' + brl(est) + '.' };
  else if (minimo <= est) v = { k: 'warn', t: 'Cabe acima do piso, mas abaixo da margem alvo. Lance mínimo de ' + brl(minimo) + '.' };
  else if (equil <= est) v = { k: 'bad', t: 'Só chega perto de empatar: fica abaixo do piso. Precisa de aprovação do sócio ou descartar.' };
  else v = { k: 'bad', t: 'Não cabe: o valor estimado não cobre o custo.' };
  return { mensal: mensal, direto: direto, indir: indir, custo: custo, alvo: alvo, minimo: minimo, equil: equil, est: est, margemEst: margemEst, v: v, mesesN: +o.meses || 0 };
}

async function salvarOrc(o, r) {

}

function paint() {

<title>Controle de Licitações</title>

<style>
/* Layout: menu lateral escuro + área de trabalho clara; cada módulo é uma tela (painel, tabelas, quadro, calculadora). */
:root{
  --bg:#F1F6F0; --surface:#FFFFFF; --surface-2:#F6FAF5; --line:#DCE6D9; --line-strong:#C5D3C1;
  --fg:#15241D; --muted:#58695F; --faint:#86968C;
  --brand:#0B3A22; --brand-2:#14512F; --brand-fg:#E4F1E6; --brand-muted:#A6C4AE;

  --hero-a:#0A3320; --hero-b:#16602F; --lime:#9AD14B;
  --ok:#25693F; --ok-bg:#DBEEE1; --warn:#835410; --warn-bg:#F7E8C6; --bad:#A3342A; --bad-bg:#F7DDD8;
  --info:#27607F; --info-bg:#DBEAF3; --viol:#5B4A8C; --viol-bg:#E8E3F4; --neutral:#4D5E54; --neutral-bg:#E5EAE4;
  --shadow:0 1px 2px rgba(14,50,28,.05),0 8px 24px rgba(14,50,28,.07);
  --font:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Plus Jakarta Sans','Public Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A140E; --surface:#112018; --surface-2:#162A1E; --line:#24392C; --line-strong:#34503F;
    --fg:#E4EEE7; --muted:#9BB0A3; --faint:#74887C;
    --brand:#06160D; --brand-2:#0F2B1A; --brand-fg:#DDEEE0; --brand-muted:#8FB09A;
    --accent:#9AD14B; --accent-ink:#10260F;
    --primary:#7BC96A; --primary-hover:#93D984; --primary-fg:#0C1A13; --primary-soft:#173A24;
    --hero-a:#07210F; --hero-b:#0F4524; --lime:#9AD14B;
    --ok:#7BD3A0; --ok-bg:#1D3A2B; --warn:#E8B964; --warn-bg:#3A2F14; --bad:#F0907F; --bad-bg:#43221D;
    --info:#86BCDD; --info-bg:#1B3444; --viol:#B7A7EA; --viol-bg:#2D2745; --neutral:#A9BBB0; --neutral-bg:#223229;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0A140E; --surface:#112018; --surface-2:#162A1E; --line:#24392C; --line-strong:#34503F;
    --fg:#E4EEE7; --muted:#9BB0A3; --faint:#74887C;
    --brand:#06160D; --brand-2:#0F2B1A; --brand-fg:#DDEEE0; --brand-muted:#8FB09A;
    --accent:#9AD14B; --accent-ink:#10260F;
    --primary:#7BC96A; --primary-hover:#93D984; --primary-fg:#0C1A13; --primary-soft:#173A24;
    --hero-a:#07210F; --hero-b:#0F4524; --lime:#9AD14B;
    --ok:#7BD3A0; --ok-bg:#1D3A2B; --warn:#E8B964; --warn-bg:#3A2F14; --bad:#F0907F; --bad-bg:#43221D;
    --info:#86BCDD; --info-bg:#1B3444; --viol:#B7A7EA; --viol-bg:#2D2745; --neutral:#A9BBB0; --neutral-bg:#223229;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tnum,td,th,.kpi-v{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--brand);color:var(--brand-fg);position:sticky;top:0;align-self:start;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}

.sair-m{display:none}
.login-ov{position:fixed;inset:0;z-index:200;background:radial-gradient(800px 400px at 80% -10%,rgba(154,209,75,.25),transparent 60%),linear-gradient(150deg,var(--hero-a),var(--hero-b));display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}

.login-logo{display:block;width:100%;max-width:250px;height:auto;margin:0 auto -4px}

.login input{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:10px 12px;width:100%}

.login .btn{justify-content:center;padding:11px 14px}
.side-foot{margin-top:auto;padding-top:16px;font-size:12px;color:var(--brand-muted)}
.side-foot button{background:transparent;border:1px solid var(--brand-2);color:var(--brand-fg);border-radius:8px;padding:7px 10px;cursor:pointer;width:100%;font-size:12.5px;margin-top:8px}
.side-foot button:hover{background:var(--brand-2)}

.main{padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1480px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-family:var(--display);font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.ph p{color:var(--muted);margin-top:2px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#10260F}
.btn.lime:hover{background:#add95f}
.btn.onDark{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn.onDark:hover{background:rgba(255,255,255,.12)}
.btn.danger{color:var(--bad);border-color:var(--line-strong)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--neutral-bg);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--neutral-bg);color:var(--fg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card-p{padding:18px 20px}
.card h3{font-size:14.5px;font-weight:700}
.card .sub{color:var(--muted);font-size:12.5px}
.filters{padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.filters .fld{min-width:130px;flex:1 1 130px}
.filters .fld.grow{flex:2 1 240px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld-l{font-size:12.5px;font-weight:600;color:var(--fg)}
.fld-h{font-size:12px;color:var(--muted)}
.fld-h.ok{color:var(--ok)} .fld-h.warn{color:var(--warn)} .fld-h.bad{color:var(--bad)}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:8px 11px;min-height:38px;color:var(--fg)}
textarea{resize:vertical;min-height:70px}
input:disabled,select:disabled{background:var(--surface-2);color:var(--muted)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);flex:none}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:36px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tbody tr.row{cursor:pointer}
td.nw{white-space:nowrap}
tbody tr.row:hover td{background:var(--surface-2)}
tr.det td{background:var(--surface-2);padding:16px 18px 18px}
.caret{color:var(--faint);display:inline-grid;transition:transform .12s}
tr.open .caret{transform:rotate(90deg)}
.cell-t{font-weight:600}
.cell-s{color:var(--muted);font-size:12.5px}
.clip{max-width:340px}
.empty{padding:42px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:14px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)} .pill.viol{background:var(--viol-bg);color:var(--viol)} .pill.primary{background:var(--primary-soft);color:var(--primary)}
.pill.solid{background:var(--primary);color:var(--primary-fg)}
.ex{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);padding:1px 6px;border-radius:5px;font-weight:700;margin-left:6px;vertical-align:middle}

.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-l{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi-v{font-family:var(--display);font-size:28px;line-height:1.2;font-weight:700}
.kpi-s{color:var(--muted);font-size:12px}
.hero{position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(900px 340px at 85% -10%,rgba(154,209,75,.28),transparent 60%),linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;padding:34px 36px 30px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero-in{position:relative;z-index:1;max-width:620px}
.hero-eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.hero h1{font-family:var(--display);font-size:38px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:10px 0 12px;color:#fff}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero-sub{color:rgba(255,255,255,.82);font-size:15px;max-width:520px}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:#fff}
.hero-chip b{color:var(--lime);font-weight:800}
.hero-chip.warn b{color:#ffb4a8}
.hero-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero-deco{position:absolute;right:-30px;top:-20px;bottom:-20px;width:46%;pointer-events:none;opacity:.9}
.hero-deco svg{width:100%;height:100%}
.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-radius:20px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;margin:0 0 16px;overflow:hidden;box-shadow:var(--shadow)}
.band .kpi{background:transparent;border:0;border-radius:0;box-shadow:none;border-right:1px solid rgba(255,255,255,.14);padding:18px 20px}
.band .kpi:last-child{border-right:0}
.band .kpi-l{color:rgba(255,255,255,.78)}
.band .kpi-v{color:#fff;font-size:30px;font-weight:800}
.band .kpi-s{color:var(--lime)}
.kpi-v.ok{color:var(--ok)} .kpi-v.bad{color:var(--bad)} .kpi-v.warn{color:var(--warn)}
b.neg{color:var(--bad)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--line-strong);border-radius:16px;padding:24px 16px;background:var(--surface-2);cursor:pointer;color:var(--muted)}
.imp-map{margin:0 0 4px}.imp-map summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}.imp-tb td,.imp-tb th{white-space:nowrap}.imp-tb td.clip{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.drop:hover,.drop.on{border-color:var(--primary);background:var(--primary-soft)}
.drop b{color:var(--fg)}
.lrow .tick{margin-top:0}
.sec-t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 10px}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0}
.goal{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:7px;min-width:0}
.goal:last-child{border-right:0}
.goal-v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}
.goal-v small{font-family:var(--font);font-size:13px;color:var(--muted);font-weight:500}
.bar{height:7px;border-radius:99px;background:var(--neutral-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--accent)} .bar.bad i{background:var(--bad)}
.blist{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.brow{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.brow .bar{height:10px;border-radius:5px}.brow .bar i{border-radius:5px}
.brow b{font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:16px}
.colb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.colb .pair{display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center;flex:1}
.colb .pair i{display:block;width:42%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px}
.colb .a{background:var(--primary-soft);border:1px solid var(--primary)} .colb .b{background:var(--primary)}
.colb span{font-size:12px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.lrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .d{width:46px;flex:none;text-align:center;line-height:1.15;font-weight:700}
.lrow .d small{display:block;color:var(--muted);font-weight:500;font-size:11px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}

.tab:hover{color:var(--fg)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip b{color:var(--fg);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.chip[aria-pressed="true"] b{color:var(--primary-fg)}

.overlay{position:fixed;inset:0;background:rgba(8,16,12,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:60;overflow:auto}
.overlay.top{z-index:80;align-items:center}
.modal{background:var(--surface);border-radius:16px;width:min(780px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;margin:auto}

.modal.lg{width:min(980px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:12px}
.modal-head h2{font-family:var(--display);font-size:19px;font-weight:700}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 16px 16px}

.fs{display:flex;flex-direction:column;gap:12px}

.fs:first-child .fs-t{border-top:0;padding-top:0}
.row2,.row3,.row4{display:grid;gap:12px}
.row2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row4{grid-template-columns:repeat(4,minmax(0,1fr))}
.err{background:var(--bad-bg);color:var(--bad);padding:9px 12px;border-radius:9px;font-weight:600;font-size:13px}

}

    client = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  } catch (e) {
    window.SB_ERR = 'config';
    window.claude = { use: async () => null };

  }
  const T = 'docs';
  const cache = {};            // coleção -> Map(id -> dados)
  const colL = {};             // coleção -> Set(listeners de coleção)
  const docL = {};             // 'col/id' -> Set(listeners de documento)

  const clone = o => JSON.parse(JSON.stringify(o));

    return { docs, size: docs.length, empty: !docs.length };
  };
  const docSnap = (col, id) => {
    const m = cache[col];
    if (m && m.has(id)) return { id, exists: true, data: () => clone(m.get(id)) };

    (colL[col] || []).forEach(f => later(() => f(colSnap(col))));

  };
  const applyRow = (row) => { (cache[row.collection] ||= new Map()).set(row.id, row.data || {}); notify(row.collection, row.id); };
  const removeRow = (col, id) => { if (cache[col]) cache[col].delete(id); notify(col, id); };

  async function loadAll() {
    const fresh = {};

      const { data, error } = await client.from(T).select('collection,id,data').order('collection').order('id').range(from, from + 999);
      if (error) throw error;
      data.forEach(r => { (fresh[r.collection] ||= new Map()).set(r.id, r.data || {}); });
      if (data.length < 1000) break;
    }
    const cols = new Set([...Object.keys(cache), ...Object.keys(fresh), ...Object.keys(colL)]);

async function criarChecklistEdital(e) {

  const novos = MODELO_EDITAL.map((m, i) => ({ m, i })).filter(x => !existentes.has('ed-' + e.id + '-' + x.i));
  if (!novos.length) { toast('Este edital já tem o checklist na agenda.'); return; }

function buildControl(fd, v) {
  if (fd.type === 'select') return sel(fd.opts, v, fd.blank === undefined ? '—' : fd.blank);
  if (fd.type === 'check') return h('input', { type: 'checkbox', checked: !!v });
  if (fd.type === 'textarea') { const t = h('textarea'); t.value = v || ''; return t; }
  if (fd.type === 'date' || fd.type === 'month') return inp(fd.type, v);
  if (fd.type === 'pct') return inp('number', v == null ? null : Math.round(v * 10000) / 100, { min: '0', step: 'any' });
  if (fd.type === 'number') return inp('number', v, { min: fd.min == null ? '0' : fd.min, step: fd.step || 'any' });
  return inp('text', v);
}

}

function funcCusto(f) {
  const p = S.prem;
  const base = (+f.salario || 0) + (f.insalubridade ? p.salMin * p.insalPct : 0);
  const enc = base * (p.encargos + p.inss);
  const total = base + enc + (+f.alimTransp || 0) + (+f.epi || 0);
  return { base: base, enc: enc, total: total, hora: total / (p.dias * p.horas) };
}
/* Gastos reais dos últimos 90 dias (lançados no Controle de gastos), em média por mês. Sem lançamentos: null. */
function equipReal(e) {
  const n = norm(e.nome), td = todayISO(), ini = addDays(td, -90);
  const f = S.data.abastecimentos.filter(x => norm(x.maquina) === n && x.data >= ini && x.data <= td);
  const o = S.data.oficina.filter(x => norm(x.maquina) === n && x.data >= ini && x.data <= td);
  const all = f.concat(o); if (!all.length) return null;
  const first = all.reduce((m, x) => x.data < m ? x.data : m, td);
  const meses = Math.min(3, Math.max(1, (diffDays(td, first) + 1) / 30));

  ['Mobilizar equipe e equipamentos', 10], ['Enviar a primeira medição', 40], ['Avaliar renovação ou aditivo (60 dias antes do fim)', null]
];
const MAX_ARQUIVO = 50 * 1024 * 1024;
const statusKind = s => ({ 'Em execução': 'ok', 'Encerrado': '', 'Suspenso': 'warn', 'Rescindido': 'bad' })[s] || '';
const fmtBytes = n => n == null ? '—' : n < 1024 ? n + ' B' : n < 1048576 ? fmtN(n / 1024, 0) + ' KB' : fmtN(n / 1048576, 1) + ' MB';
const compLabel = s => s ? MES3[+s.slice(5, 7) - 1] + '/' + s.slice(0, 4) : '—';
function addMeses(dataISO, n) { const d = parseD(dataISO); d.setMonth(d.getMonth() + n); d.setDate(d.getDate() - 1); return iso(d); }

function medSit(m) {
  const fat = m.valorFaturado || 0, rec = m.valorRecebido || 0;
  if (rec > 0 && rec >= fat - 0.005) return 'Recebido';
  if (rec > 0) return 'Parcial';
  if (m.previsao && m.previsao < todayISO()) return 'Atrasado';
  return 'A receber';
}
const sitKind = s => ({ 'Recebido': 'ok', 'Parcial': 'info', 'Atrasado': 'bad', 'A receber': 'warn' })[s] || '';
function orcDoContrato(c) {
  const l = S.data.orcamentos.filter(o => o.editalId && o.editalId === c.editalId && o.res && o.res.custo);
  return l.sort((a, b) => (b.atualizadoEm || 0) - (a.atualizadoEm || 0))[0] || null;
}
function vigenciaInfo(c) {
  if (!c.fimVigencia) return { txt: 'Sem vigência', kind: '', dias: null };
  const dias = diffDays(c.fimVigencia, todayISO());
  if (c.status !== 'Em execução') return { txt: 'Até ' + fmtD(c.fimVigencia), kind: '', dias };
  if (dias < 0) return { txt: 'Vencido há ' + (-dias) + ' dia' + (dias === -1 ? '' : 's'), kind: 'bad', dias };
  if (dias === 0) return { txt: 'Vence hoje', kind: 'bad', dias };
  return { txt: 'Vence em ' + dias + ' dia' + (dias === 1 ? '' : 's'), kind: dias <= 30 ? 'bad' : dias <= 90 ? 'warn' : 'ok', dias };
}
function fechStats(c) {
  const med = S.data.medicoes.filter(m => m.contratoId === c.id);
  const gas = S.data.gastos.filter(g => g.contratoId === c.id);
  const faturado = sum(med, m => m.valorFaturado), recebido = sum(med, m => m.valorRecebido);
  const atrasado = sum(med.filter(m => medSit(m) === 'Atrasado'), m => (m.valorFaturado || 0) - (m.valorRecebido || 0));
  const custoReal = sum(gas, g => g.valor);
  const orc = orcDoContrato(c);
  const aliq = S.prem.aliquota || 0;
  const imposto = faturado * aliq;
  const resultado = faturado - imposto - custoReal;
  return { med, gas, faturado, recebido, aReceber: Math.max(0, faturado - recebido), atrasado, aFaturar: Math.max(0, (c.valorContratado || 0) - faturado),
    custoReal, orc, custoOrc: orc ? orc.res.custo : null, aliq, imposto, resultado, margem: faturado > 0 ? resultado / faturado : null };
}
function tone(v) { return v > 0 ? 'ok' : v < 0 ? 'bad' : ''; }

  async function saveBill(M, id, patch) {

    if (b.fixed) {
      const body = Object.assign({ fixed: true, valor: b.valor, venc: b.venc, status: b.status, pagoEm: b.pagoEm }, patch);
      await dbSave('contas', id, body);

  }
  async function togglePay(M, id) {
    const b = M.bills.find(x => x.id === id); if (!b) return;

      else { await saveBill(M, id, { status: 'Pago', pagoEm: todayISO() }); toast((b.cat || 'Conta') + ' marcada como paga'); }

      cfgTimer = null;
      try { await S.db.doc('config/controle').set(clone(S.ctl)); } catch (e) { toast('Não foi possível salvar os ajustes.', 'bad'); }
      CTLSYNC.dirty = false;

      CH[id] = new Chart(el, make(cs));

        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + (c.dataset.fmt === 'n' ? N0(c.parsed.y) : c.dataset.fmt === 'l' ? N2(c.parsed.y) : R(c.parsed.y)) } } },

      host);
    return wrap;
  }
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.route === 'controle' || S.route === 'familia' || S.route === 'geral') render(); }); } catch (e) {}
  return build;
})();

/* ================= shell, rotas e inicialização ================= */
const ROUTES = { painel: viewPainel, controle: () => viewControle('empresa'), familia: () => viewControle('familia'), geral: () => viewControle('geral'), editais: viewEditais, agenda: viewAgenda, clientes: viewClientes, cidades: viewCidades, custos: viewCustos, fechamento: viewFechamento };
const NAV = [
  { g: 'Visão geral', items: [['painel', 'Painel']] },
  { g: 'Licitações', items: [['editais', 'Editais'], ['agenda', 'Agenda semanal']] },
  { g: 'Contratos', items: [['fechamento', 'Contratos']] },
  { g: 'Financeiro', items: [['geral', 'Financeiro geral'], ['controle', 'Controle de gastos'], ['familia', 'Família']] },
  { g: 'Cadastros', items: [['clientes', 'Clientes'], ['cidades', 'Cidades'], ['custos', 'Equipe e custos']] }
];
const app = document.getElementById('app');
function navCount(r) {
  if (r === 'editais') return S.data.editais.length || '';
  if (r === 'clientes') return S.data.clientes.length || '';
  if (r === 'fechamento') return S.data.contratos.filter(c => c.status === 'Em execução').length || '';
  if (r === 'agenda') return S.data.tarefas.filter(t => t.status !== 'done' && t.data && t.data < todayISO()).length || '';
  return '';
}
function hasExemplos() { return COLS.some(c => S.data[c].some(x => x.exemplo)); }
async function apagarExemplos() {
  const items = []; COLS.forEach(c => S.data[c].filter(x => x.exemplo).forEach(x => items.push([c, x.id])));
  if (!items.length) return;
  if (!await askConfirm({ title: 'Apagar dados de exemplo', text: 'Apagar ' + items.length + ' registros marcados como exemplo? O que você cadastrou fica.', yes: 'Apagar exemplos', danger: true })) return;
  await Promise.all(items.map(it => dbDelete(it[0], it[1]))); toast('Exemplos apagados');
}
function sidebar() {
  const nav = h('aside', { class: 'side' },
    window.SB
      ? h('div', { class: 'brand-logo' }, h('img', { src: 'logo.jpg', alt: 'Natisa Garden paisagismo' }), h('span', null, 'Controle de licitações'))
      : h('div', { class: 'brand' }, h('div', { class: 'brand-mark' }, icon('leaf', 20)), h('div', null, h('b', null, 'Natisa · José Renato'), h('span', null, 'Controle de licitações'))));
  NAV.forEach(g => {
    nav.append(h('div', { class: 'nav-g' }, g.g));
    g.items.forEach(it => nav.append(h('button', { class: 'nav', type: 'button', 'aria-current': S.route === it[0] ? 'page' : null, onclick: () => go(it[0]) }, icon(it[0], 18), it[1], h('span', { class: 'n' + (it[0] === 'agenda' ? ' late' : ''), title: it[0] === 'agenda' ? 'Tarefas atrasadas' : null }, navCount(it[0])))));
  });
  if (window.SB) nav.append(h('button', { class: 'nav sair-m', type: 'button', onclick: () => window.SB.signOut() }, icon('logout', 18), 'Sair'));
  nav.append(h('div', { class: 'side-foot' }, S.db ? 'Dados salvos e compartilhados com quem tem acesso.' : 'Sem conexão com o banco de dados.', hasExemplos() ? h('button', { type: 'button', onclick: apagarExemplos }, 'Apagar dados de exemplo') : null, window.SB ? h('button', { type: 'button', onclick: () => window.SB.signOut() }, 'Sair' + (S.email ? ' (' + S.email + ')' : '')) : null));
  return nav;
}
function paint() {
  const y = window.scrollY;
  let content;
  if (!S.ready) content = h('div', { class: 'loading' }, 'Carregando os dados…');
  else { try { content = (ROUTES[S.route] || viewPainel)(); } catch (e) { console.error(e); content = h('div', { class: 'err' }, 'Não foi possível montar esta tela: ' + e.message); } }
  const banner = !S.db && S.ready ? h('div', { class: 'banner' }, window.SB_ERR === 'config' ? 'O sistema ainda não foi conectado ao banco de dados: falta preencher a URL e a chave do Supabase no arquivo config.js.' : 'Não foi possível conectar ao banco de dados. Atualize a página; se continuar, confira a conexão com a internet ou avise quem cuida do sistema.') : null;
  app.replaceChildren(sidebar(), h('main', { class: 'main' }, banner, content));
  window.scrollTo(0, y);
}
let rafId = 0;
function render() { if (rafId) return; rafId = requestAnimationFrame(() => { rafId = 0; paint(); }); }
function setRoute() {
  const parts = location.hash.slice(1).split('/');
  const r = parts[0];
  const next = ROUTES[r] ? r : 'painel';
  const fid = next === 'fechamento' && parts[1] ? decodeURIComponent(parts[1]) : null;
  const changed = next !== S.route || fid !== S.fechId;
  S.route = next; S.fechId = fid;
  if (changed) S.ui.fech.aba = 'resumo';
  render();
  if (changed) window.scrollTo(0, 0);
}
async function boot() {
  window.addEventListener('hashchange', setRoute);
  setRoute(); render();
  const cl = window.claude;
  if (!cl || !cl.use) { S.ready = true; render(); return; }
  let db = null, dl = null, fl = null;
  try { [db, dl, fl] = await Promise.all([cl.use('db'), cl.use('downloads'), cl.use('files').catch(() => null)]); } catch (e) { console.error(e); }
  S.dl = dl; S.files = fl;
  if (!db) { S.ready = true; render(); return; }
  S.db = db;
  if (window.SB) window.SB.email().then(e => { S.email = e; render(); });
  const mark = k => { S.loaded.add(k); if (S.loaded.size >= COLS.length + 2) S.ready = true; render(); };
  COLS.forEach(col => db.collection(col).onSnapshot(
    snap => { S.data[col] = snap.docs.map(d => Object.assign({ id: d.id }, JSON.parse(JSON.stringify(d.data())))); mark(col); },
    err => { console.error(col, err); mark(col); }));
  db.doc('config/premissas').onSnapshot(
    snap => { S.premSaved = !!snap.exists; S.prem = Object.assign({}, DEFAULT_PREM, snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {}); mark('prem'); },
    () => mark('prem'));
  db.doc('config/controle').onSnapshot(
    snap => { if (!CTLSYNC.dirty) S.ctl = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null; mark('ctl'); },
    () => mark('ctl'));
  setTimeout(() => { if (!S.ready) { S.ready = true; render(); } }, 8000);
}
boot();
</script></body></html>
